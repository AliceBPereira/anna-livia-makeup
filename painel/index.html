<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A2622">
<title>Painel · Anna Lívia Makeup</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232A2622'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23C8A96A'%3EAL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel.css">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
<div id="demo" class="demo" hidden>Modo demonstração — as alterações ficam salvas só neste navegador. Configure o Firebase para publicar (veja o LEIA-ME).</div>

<div id="boot" class="boot"><i class="spin"></i></div>

<!-- LOGIN -->
<section id="login" class="auth" hidden>
  <form class="auth-card" id="loginForm" novalidate>
    <div class="brand"><b>Anna Lívia</b><span>MAKEUP · PAINEL</span></div>
    <label>E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label>Senha<span class="pw"><input type="password" name="password" autocomplete="current-password" required><button type="button" class="eye" aria-label="Mostrar senha"></button></span></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary block" type="submit">Entrar</button>
    <button class="link" type="button" id="forgot">Esqueci minha senha</button>
    <a class="link muted" href="../">← Voltar para o site</a>
  </form>
</section>

<!-- PRIMEIRA CONFIGURAÇÃO -->
<section id="setup" class="auth" hidden>
  <form class="auth-card" id="setupForm" novalidate>
    <div class="brand"><b>Anna Lívia</b><span>CONFIGURAÇÃO INICIAL</span></div>
    <p class="help">Crie o acesso principal do painel. Esta tela aparece só uma vez.</p>
    <label>Seu nome<input name="name" required autocomplete="name"></label>
    <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
    <label>Senha (mínimo 6 caracteres)<span class="pw"><input type="password" name="password" required minlength="6" autocomplete="new-password"><button type="button" class="eye" aria-label="Mostrar senha"></button></span></label>
    <p class="err" id="setupErr" role="alert"></p>
    <button class="btn primary block" type="submit">Criar acesso e entrar</button>
  </form>
</section>

<!-- PAINEL -->
<div id="app" class="app" hidden>
  <header class="top">
    <div class="brand sm"><b>Anna Lívia</b><span>PAINEL</span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="fotos"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.7"/><path d="M3.5 17l5-5 4 4 2.5-2.5 5.5 5.5"/></svg><span>Fotos</span></button>
      <button data-tab="textos"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>Capa, Cores & Textos</span></button>
      <button data-tab="acessos"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3.3 3 3.5 6"/></svg><span>Acessos</span></button>
      <button data-tab="conta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-7 8-7s7.2 2.8 8 7"/></svg><span>Conta</span></button>
    </nav>
    <button class="undo-btn" id="undoBtn" hidden title="Desfazer última alteração"><svg viewBox="0 0 24 24"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Desfazer</span></button>
    <a class="see" href="../" target="_blank" rel="noopener">Ver site<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </header>
  <main class="content" id="content"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modals"></div>

<script type="module" src="painel.js"></script>
</body>
</html>
